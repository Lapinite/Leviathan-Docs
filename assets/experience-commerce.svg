 font-size="10">grant • refund • revoke</text></g><g><rect x="915" y="320" width="230" height="90" rx="14" fill="#061722" stroke="#aa78ff"/><text x="1030" y="346" fill="#eefcff" font-size="15" font-weight="750">COSMETICS + LEVICOINS</text><text x="1030" y="371" fill="#9ca7bd" font-size="10">ownership • equipped state • wallet ledger</text><text x="1030" y="389" fill="#718096" font-size="9">grants • spends • adjustments</text></g></g><text x="600" y="478" text-anchor="middle" fill="#6a8b9e" font-family="Segoe UI,Arial" font-size="11">Creator/referral attribution and anti-abuse checks can attach to verified orders and reward grants.</text><text x="600" y="508" text-anchor="middle" fill="#587b8f" font-family="ui-monospace,Consolas,monospace" font-size="10">PUBLIC DIRECTION ONLY • PRIVATE PAYMENT/FRAUD LOGIC, DATABASE SCHEMAS AND PROVIDER SECRETS ARE EXCLUDED</text><rect x="4" y="4" width="1192" height="552" rx="22" fill="none" stroke="#32efff" stroke-width="3" stroke-dasharray="420 1700" filter="url(#g)" opacity=".9"><animate attributeName="stroke-dashoffset" values="0;-2120" dur="10s" repeatCount="indefinite"/></rect></svg>